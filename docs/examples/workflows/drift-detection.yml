# Detect settings that were changed outside the bootstrap configuration.
# `plan --ci` is the drift check: it exits 0 when the plan has no blocked entry
# and no difference the tool can converge, 2 when a create or update would be
# made, and 1 when the command fails. A blocked plan is a failure and outranks
# drift, so it exits 1 even when a difference is also present. Exit 0 is not
# proof that every setting matches: secret updates and manual entries (seed,
# commands, agent files) are excluded from the comparison.
#
# GitHub never returns a secret value, so a declared secret whose source
# environment variable is set is reported as an update on every run, and
# including those would leave this check permanently red. A secret whose source
# environment variable is not set is reported as blocked instead, which exits
# 1. Rotate credentials with a separate workflow_dispatch run of
# `apply --force-secrets`.
name: Bootstrap drift

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh-repospec
        run: gh extension install kkamegawa/gh-repospec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The report is written to a file rather than piped, so the step result
      # comes from the extension's exit code and not from the last command in
      # a pipeline. The drift notice goes to standard error, so plan.json
      # stays a valid document at every exit code.
      - name: Detect drift
        run: gh repospec plan --file bootstrap.yaml --format json --ci > plan.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the plan
        if: always()
        run: cat plan.json
