# Apply the bootstrap configuration whenever it changes on the default branch.
# Copy this into .github/workflows/ of the repository that stores the
# configuration file.
name: Bootstrap apply

on:
  push:
    branches:
      - main
    paths:
      - bootstrap.yaml

# The extension keeps no state file and therefore takes no lock. Serialize
# applies so two runs cannot interleave writes to the same repository.
concurrency:
  group: repospec-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh-repospec
        run: gh extension install kkamegawa/gh-repospec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply
        run: gh repospec apply --file bootstrap.yaml --yes
        env:
          # GITHUB_TOKEN can administer the repository this workflow runs in.
          # Targeting a different repository requires a fine-grained personal
          # access token or a GitHub App installation token with Administration
          # and Contents write access, plus secret and variable access when the
          # configuration declares them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Environment variables named by `sourceEnv` must be present here.
          # EXAMPLE_TOKEN: ${{ secrets.EXAMPLE_TOKEN }}
          #
          # Do not add `--force-secrets` to this step. It writes every declared
          # secret on every run, silently overrides the `updatePolicy` each
          # secret declares, and widens secret exposure in a job that starts
          # automatically. Credential rotation belongs in a separate
          # workflow_dispatch workflow a person starts deliberately:
          #   gh repospec apply --file bootstrap.yaml --yes --force-secrets
