name: Release precompiled extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish extension binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify the configured Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          go version
          case "$(go env GOVERSION)" in
            go1.26.*) ;;
            *) echo "Go 1.26 is required" >&2; exit 1 ;;
          esac

      - name: Test the tagged source
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Build GitHub CLI extension assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<<"${target}"
            extension=""
            if [[ "${goos}" == "windows" ]]; then
              extension=".exe"
            fi
            output="dist/gh-repobootstrapper-${goos}-${goarch}${extension}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w -X github.com/kkamegawa/gh-repobootstrapper/internal/cli.Version=${GITHUB_REF_NAME}" \
              -o "${output}" ./cmd/gh-repobootstrapper
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
