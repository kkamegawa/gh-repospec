name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run unit tests
        run: go test -shuffle=on ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build the extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          go build -o bin/gh-repospec ./cmd/gh-repospec

      - name: Run race detector
        if: runner.os == 'Linux'
        run: go test -race -shuffle=on -count=1 ./...
